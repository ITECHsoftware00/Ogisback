<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (overridden per-page by react-helmet-async) -->
    <title>OgisBack — Where Creators Meet Brands</title>
    <meta name="description" content="OgisBack is the content-first influencer marketplace. Creators post content. Brands discover them. They connect, agree on deals, and pay securely through escrow." />
    <meta name="theme-color" content="#7C3AED" />

    <!-- Open Graph base -->
    <meta property="og:site_name" content="OgisBack" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ogisback.com" />
    <meta property="og:title" content="OgisBack — Where Creators Meet Brands" />
    <meta property="og:description" content="OgisBack is the content-first influencer marketplace. Creators post content. Brands discover them. They connect, agree on deals, and pay securely through escrow." />
    <meta property="og:image" content="https://ogisback.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card base -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ogisback" />
    <meta name="twitter:title" content="OgisBack — Where Creators Meet Brands" />
    <meta name="twitter:description" content="OgisBack is the content-first influencer marketplace. Creators post content. Brands discover them. Connect, collaborate, and earn." />
    <meta name="twitter:image" content="https://ogisback.com/og-image.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ogisback.com" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Organization structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OgisBack",
      "url": "https://ogisback.com",
      "logo": "https://ogisback.com/favicon.svg",
      "description": "OgisBack is the content-first influencer marketplace where creators meet brands.",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OgisBack",
      "url": "https://ogisback.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ogisback.com/explore?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
